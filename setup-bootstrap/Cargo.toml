[workspace]

[package]
name = "sonarsniffer-setup"
version = "0.8.0"
edition = "2021"
description = "Single-file SonarSniffer Windows setup launcher (extract + PowerShell install)"

[[bin]]
name = "SonarSniffer-Setup"
path = "src/main.rs"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
