[package]
name = "sonarsniffer"
version = "0.1.0"
description = "SonarSniffer - Cross-platform sonar data processing desktop app"
authors = ["SonarSniffer Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = [
    "shell-sidecar",
    "http-all",
    "dialog-all",
    "shell-execute",
    "window-all",
    "shell-open",
    "fs-all",
    "path-all",
] }
tokio = { version = "1.35", features = ["full"] }
rusqlite = { version = "0.30", features = ["bundled"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

[features]
default = []

[[example]]
name = "helloworld"
path = "examples/helloworld.rs"
