name: build-and-test-gst-encoder

on:
  push:
    paths:
      - 'tools/gstreamer_encoder/**'
      - 'src/sonarsniffer/gstreamer_bridge.py'
      - 'scripts/test_gstreamer_encoder.py'
  pull_request:
    paths:
      - 'tools/gstreamer_encoder/**'
      - 'src/sonarsniffer/gstreamer_bridge.py'
      - 'scripts/test_gstreamer_encoder.py'

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps (GStreamer/ffmpeg)
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential pkg-config libssl-dev
            sudo apt-get install -y gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev ffmpeg
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            brew install gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-ugly gst-libav ffmpeg
          else
            choco install -y gstreamer
            choco install -y ffmpeg
          fi
        shell: bash

      - name: Setup Rust
        uses: actions/setup-rust@v1
        with:
          toolchain: stable

      - name: Build gst_encoder (release)
        working-directory: tools/gstreamer_encoder
        run: |
          cargo build --release

      - name: Upload gst_encoder artifact
        uses: actions/upload-artifact@v4
        with:
          name: gst_encoder-${{ matrix.os }}
          path: tools/gstreamer_encoder/target/release/gst_encoder*

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow azure-storage-blob

      - name: Run gstreamer encoder test (force x264enc)
        run: |
          GST_ENCODER_PATH=$(pwd)/tools/gstreamer_encoder/target/release/gst_encoder
          export GST_ENCODER_PATH
          export GST_TEST_ENCODER=x264enc
          python scripts/test_gstreamer_encoder.py
        shell: bash

      - name: Run gstreamer encoder fallback test (force fallback via bad encoder)
        run: |
          GST_ENCODER_PATH=$(pwd)/tools/gstreamer_encoder/target/release/gst_encoder
          export GST_ENCODER_PATH
          export GST_TEST_FORCE_FALLBACK=1
          python scripts/test_gstreamer_encoder.py
        shell: bash

  telemetry-validate:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ secrets.AZURE_TEST_STORAGE_CONNSTR && secrets.AZURE_TEST_STORAGE_CONTAINER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install azure-storage-blob
      - name: Run telemetry upload test
        env:
          AZURE_TEST_STORAGE_CONNSTR: ${{ secrets.AZURE_TEST_STORAGE_CONNSTR }}
          AZURE_TEST_STORAGE_CONTAINER: ${{ secrets.AZURE_TEST_STORAGE_CONTAINER }}
        run: python scripts/ci_azure_telemetry_test.py
