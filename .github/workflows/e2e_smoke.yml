name: e2e-smoke

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow

      - name: Run end-to-end smoke test (conservative)
        env:
          HOLLOWAY_SAMPLE_STRIDE: '10'
          HOLLOWAY_MAX_RECORDS: '200'
          HOLLOWAY_VIDEO_WIDTH: '512'
          HOLLOWAY_VIDEO_HEIGHT: '64'
          HOLLOWAY_VIDEO_FPS: '5'
        run: |
          python scripts/run_end_to_end.py

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: e2e-outputs
          path: outputs/holloway_smoke/**

  telemetry-assertions:
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ secrets.AZURE_TEST_STORAGE_CONNSTR && secrets.AZURE_TEST_STORAGE_CONTAINER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: python -m pip install azure-storage-blob
      - name: Run telemetry upload test
        env:
          AZURE_TEST_STORAGE_CONNSTR: ${{ secrets.AZURE_TEST_STORAGE_CONNSTR }}
          AZURE_TEST_STORAGE_CONTAINER: ${{ secrets.AZURE_TEST_STORAGE_CONTAINER }}
        run: python scripts/ci_azure_telemetry_test.py
      - name: Assert telemetry blob exists
        env:
          AZURE_TEST_STORAGE_CONNSTR: ${{ secrets.AZURE_TEST_STORAGE_CONNSTR }}
          AZURE_TEST_STORAGE_CONTAINER: ${{ secrets.AZURE_TEST_STORAGE_CONTAINER }}
        run: |
          python - <<'PY'
import os, time
from azure.storage.blob import BlobServiceClient
conn = os.environ['AZURE_TEST_STORAGE_CONNSTR']
container = os.environ['AZURE_TEST_STORAGE_CONTAINER']
client = BlobServiceClient.from_connection_string(conn)
cont = client.get_container_client(container)
# look for recent test file uploaded in last 5 minutes
found = False
now = int(time.time())
for blob in cont.list_blobs():
    if blob.name.startswith('test_telemetry_'):
        # crude freshness check
        found = True
        print('Found telemetry blob:', blob.name)
        break
if not found:
    raise SystemExit('Telemetry blob not found in container')
PY